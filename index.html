<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B1A16"><title>Santiago Barbieri — Portfolio</title>
  <link rel="stylesheet" href="style/main.css">
  <script src="js/catalog.js" defer></script><script src="js/main.js" defer></script>
  <script src="js/viewer.js" defer></script><script src="js/panels.js" defer></script><script src="js/featured.js" defer></script>
</head>
<body>
  <main class="journey" id="journey">
    <section class="home" aria-label="Introducción">
      <p class="home-name">Santiago Barbieri — Buenos Aires</p>
      <h1>Diseño y desarrollo<br>con una idea propia<br>de cada marca.</h1>
      <a class="home-scroll" href="#featured-start">Scroll para explorar <span aria-hidden="true">↓</span></a>
    </section>
    <section class="featured-section" aria-label="Cinco proyectos destacados" id="featured-start">
      <section class="featured-load" hidden><p class="featured-message" role="status"></p><label>Seleccionar JSON de proyectos <input type="file" accept=".json,application/json"></label></section>
      <ol class="featured-list" aria-label="Proyectos destacados"></ol>
    </section>
    <section class="portal" id="portal" aria-label="Entrada a la grilla">
      <div class="portal-sticky">
        <button class="portal-entry" type="button" aria-label="Abrir grilla"><span class="diamond" aria-hidden="true"></span></button>
        <p class="portal-caption">La colección <span aria-hidden="true">↓</span></p>
      </div>
    </section>
  </main>
  <dialog class="gallery" id="gallery" aria-label="Grilla de proyectos">
    <header class="gallery-controls">
      <button class="gallery-close cross" type="button" aria-label="Cerrar grilla y volver a Featured" autofocus><span></span><span></span></button>
    </header>
    <section class="catalog-load" hidden><p class="catalog-message" role="status"></p><label>Seleccionar JSON <input class="catalog-file" type="file" accept=".json,application/json"></label></section>
    <p class="sr-only" id="filter-status" role="status"></p>
    <div class="infinite-viewport" tabindex="0" aria-label="Colección infinita: desplazá con el trackpad y pellizcá para acercar o alejar"><div class="grid"></div></div>
    <div class="gallery-shade" aria-hidden="true"></div>
    <noscript>Activá JavaScript para cargar la colección.</noscript>
  </dialog>
  <dialog class="item-dialog" id="item-dialog" aria-label="Detalle del elemento">
    <button class="item-close" type="button" aria-label="Cerrar detalle" autofocus><span></span><span></span></button>
    <button class="item-arrow item-previous" type="button" aria-label="Elemento anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <button class="item-arrow item-next" type="button" aria-label="Elemento siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
    <p class="sr-only item-position" role="status" aria-live="polite"></p>
    <div class="item-layout">
      <div class="item-image-wrap"><img class="item-image" alt=""></div>
      <div class="item-information">
        <div class="item-details">
          <p class="item-category"></p>
          <h2 class="item-title"></h2>
          <p class="item-date-label">Fecha de creación <time class="item-date"></time></p>
          <a class="item-download" download hidden>Descargar <span aria-hidden="true">↓</span></a>
        </div>
        <p class="item-shop" hidden>shop in work</p>
      </div>
    </div>
  </dialog>
</body>
</html>
