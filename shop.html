<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f0e5" />
    <meta
      name="description"
      content="Santiago Barbieri — Graphic designer, Web developer and Photographer, Buenos Aires."
    />
    <title>Shop · Santiago Barbieri</title>
    <link rel="stylesheet" href="style/main.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body data-page="shop">
    <main class="shop-journey">
      <section class="shop-intro panel">
        <header class="site-header">
          <button
            class="menu-trigger"
            aria-label="Open index"
            aria-haspopup="dialog"
          >
            <span class="menu-icon" aria-hidden="true"></span><span>Shop</span>
          </button>
        </header>
        <div class="shop-welcome">
          <h1>Welcome to the<br />Gridshop, Scroll<br />to Open</h1>
          <div class="diamond-slot">
            <div class="portal-diamond" aria-hidden="true"></div>
            <button class="portal-open" aria-label="Open shop gallery"></button>
          </div>
          <p>
            Zoom in &amp; out with the touch pad,<br />Scroll in every
            direction, Filter by<br />category and Click on any<br />element to
            open the carousel
          </p>
        </div>
        <p class="mobile-hint">Scroll to explore</p>
      </section>
    </main>
    <p class="page-status" role="status"></p>
  </body>
</html>
