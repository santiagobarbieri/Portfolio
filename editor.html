<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gallery editor · Santiago Barbieri</title>
    <link rel="stylesheet" href="style/main.css" />
    <link rel="stylesheet" href="style/editor.css" />
    <script type="module" src="js/editor.js"></script>
  </head>
  <body class="editor-page">
    <header class="editor-header">
      <a href="index.html">← Portfolio</a>
      <h1>Gallery editor</h1>
      <p>Colors and content. Changes are saved when you download the JSON.</p>
    </header>
    <main class="editor-layout">
      <aside class="editor-sidebar">
        <nav class="editor-modes" aria-label="Editor section">
          <button data-mode="project" aria-pressed="true">
            Featured galleries</button
          ><button data-mode="shop" aria-pressed="false">Shop</button>
        </nav>
        <label class="gallery-select-label"
          >Gallery<select id="gallery-select">
            <option value="apolo">Apolo Studios</option>
            <option value="ola">OLA</option>
            <option value="are-we-there-yet">Are we there yet?</option>
            <option value="casa-brul">Casa Brul</option>
          </select></label
        >
        <p class="editor-mode-note">
          Local JSON files for each project gallery.
        </p>
        <div class="editor-file-actions">
          <label class="editor-upload"
            >Import JSON<input
              type="file"
              id="import-json"
              accept=".json,application/json" /></label
          ><button id="export-json" class="pill filled">Download JSON</button>
        </div>
        <p id="editor-status" role="status"></p>
        <button id="add-item" class="editor-add">+ Add item</button>
        <div id="editor-items" aria-label="Gallery items"></div>
      </aside>
      <section class="editor-workspace">
        <form id="gallery-settings">
          <h2>Gallery</h2>
          <div class="editor-fields">
            <label>Title<input name="title" required /></label
            ><label
              >Background color<input
                name="backgroundColor"
                type="color" /></label
            ><label>Text color<input name="textColor" type="color" /></label>
          </div>
        </form>
        <form id="item-form">
          <div class="item-form-heading">
            <h2>Item</h2>
            <button id="remove-item" type="button">Remove item</button>
          </div>
          <div class="editor-fields">
            <label>ID<input name="id" required /></label
            ><label>Title<input name="title" required /></label
            ><label>Category<select name="type"></select></label
            ><label
              >Year / period<input
                name="year"
                placeholder="2024 – 2026" /></label
            ><label class="wide"
              >Image path<input
                name="src"
                required
                placeholder="assets/apolo-01.jpg" /></label
            ><label class="wide"
              >Image description (alt text)<input name="alt" /></label
            ><label class="wide"
              >Description<textarea
                name="description"
                rows="4"
              ></textarea></label
            ><label class="wide"
              >Download path<input
                name="download"
                placeholder="assets/file.zip" /></label
            ><label class="shop-field"
              >Price<input
                name="price"
                type="number"
                min="0"
                step="0.01"
                placeholder="Not set" /></label
            ><label class="shop-field"
              >Currency<input
                name="currency"
                maxlength="3"
                placeholder="ARS" /></label
            ><label class="shop-field checkbox-label"
              ><input name="soldOut" type="checkbox" /> Sold out</label
            >
          </div>
        </form>
        <figure class="editor-preview">
          <img id="item-preview" alt="Item preview" />
          <figcaption>Preview</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
